services:
  backstage:
    build:
      context: .
    image: backstage:local
    pull_policy: build
    environment:
      DB_PATH: /data/backstage.db
      PORT: 8090
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      RADARR_URL: "${RADARR_URL:-http://host.docker.internal:7878}"
      RADARR_API_KEY: "${RADARR_API_KEY:-}"
      SONARR_URL: "${SONARR_URL:-http://host.docker.internal:8989}"
      SONARR_API_KEY: "${SONARR_API_KEY:-}"
      SEERR_URL: "${SEERR_URL:-http://host.docker.internal:5055}"
      SEERR_API_KEY: "${SEERR_API_KEY:-}"
      JELLYFIN_URL: "${JELLYFIN_URL:-http://host.docker.internal:8096}"
      JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"
      JELLYFIN_SERVER_ID: "${JELLYFIN_SERVER_ID:-}"
      MEDIA_SYNC_INTERVAL_SEC: "${MEDIA_SYNC_INTERVAL_SEC:-60}"
      MIN_FREE_GB: "${MIN_FREE_GB:-20}"
      TEMPORARY_MAX_GB: "${TEMPORARY_MAX_GB:-500}"
      BACKUP_DIR: "${BACKUP_DIR:-/data/backups}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-30}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      BACKSTAGE_PUBLIC_URL: "${BACKSTAGE_PUBLIC_URL:-http://localhost:8090}"
      BACKSTAGE_COOKIE_SECURE: "${BACKSTAGE_COOKIE_SECURE:-0}"
      AUTH_RATE_LIMIT_WINDOW_SEC: "${AUTH_RATE_LIMIT_WINDOW_SEC:-300}"
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: "${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}"
      AUTH_RATE_LIMIT_BLOCK_SEC: "${AUTH_RATE_LIMIT_BLOCK_SEC:-900}"
    ports:
      - "${BACKSTAGE_PORT:-8090}:8090"
    volumes:
      - "${BACKSTAGE_DATA_DIR:-./data/backstage}:/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
