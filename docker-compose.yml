services:
  backstage:
    build:
      context: .
    image: backstage:local
    env_file:
      - .env
    environment:
      DB_PATH: /data/backstage.db
      PORT: 8090
    ports:
      - "${BACKSTAGE_PORT:-8090}:8090"
    volumes:
      - "${BACKSTAGE_DATA_DIR:-./data/backstage}:/data"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
