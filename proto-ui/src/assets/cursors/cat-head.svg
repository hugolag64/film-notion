<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- His head shape: tall pointed ears, wide cheeks, soft chin -->
    <path id="head" d="M4.2 1.6 L12.2 8.1 Q16 6.6 19.8 8.1 L27.8 1.6 Q28.8 1.1 28.8 2.3 L27.7 12.4 Q30.4 16.8 28.8 21.6 Q26.2 29.6 16 30.2 Q5.8 29.6 3.2 21.6 Q1.6 16.8 4.3 12.4 L3.2 2.3 Q3.2 1.1 4.2 1.6 Z"/>
    <clipPath id="clip"><use href="#head"/></clipPath>
  </defs>

  <use href="#head" fill="#151515"/>

  <g clip-path="url(#clip)">
    <!-- Inner ears -->
    <path d="M5 4.2 L10.4 8.6 L6 11.6 Z" fill="#5a3b40"/>
    <path d="M27 4.2 L21.6 8.6 L26 11.6 Z" fill="#5a3b40"/>
    <!-- White blaze down the forehead, opening onto the white muzzle;
         more white on his right cheek than on the left -->
    <path d="M15.2 7.4 Q16 7 16.8 7.4 L18.4 17 Q22 18.6 27 19.4 L31 31 L1 31 L6 23.6 Q10 21.6 13.6 17 Z" fill="#fafafa"/>
    <!-- Little black spot under the chin -->
    <ellipse cx="16.2" cy="30.4" rx="3.4" ry="1.7" fill="#151515"/>
  </g>

  <!-- Green-gold eyes -->
  <path d="M8 16.4 Q10.8 13.6 13.6 16.4 Q10.8 19.2 8 16.4 Z" fill="#bdbb72"/>
  <path d="M18.4 16.4 Q21.2 13.6 24 16.4 Q21.2 19.2 18.4 16.4 Z" fill="#bdbb72"/>
  <ellipse cx="10.8" cy="16.4" rx="0.9" ry="1.8" fill="#111"/>
  <ellipse cx="21.2" cy="16.4" rx="0.9" ry="1.8" fill="#111"/>
  <circle cx="11.5" cy="15.6" r="0.5" fill="#fff"/>
  <circle cx="21.9" cy="15.6" r="0.5" fill="#fff"/>

  <!-- Pink nose and mouth -->
  <path d="M14.6 21.4 Q16 20.8 17.4 21.4 L16 23 Z" fill="#f0a3b1"/>
  <path d="M16 23 V23.8 M16 23.8 Q15 24.8 14 24.2 M16 23.8 Q17 24.8 18 24.2" stroke="#555" stroke-width="0.55" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <path d="M13 23 L6.5 22 M13 23.8 L7 25 M19 23 L25.5 22 M19 23.8 L25 25" stroke="#a8a8a8" stroke-width="0.4" stroke-linecap="round"/>
</svg>
